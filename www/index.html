<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tumble Block 3</title>
<style>
:root{--bg:#07081a;--fg:#f4f5ff;--accent:#ffd34d;--muted:#a9aedb;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#wrap{position:relative;height:100%;display:flex;align-items:center;justify-content:center}
canvas{height:100%;max-width:100%;aspect-ratio:360/640;display:block}
#ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:rgba(7,8,26,.7);backdrop-filter:blur(5px);padding:24px;gap:10px}
#ov h1{margin:0;font-size:38px;letter-spacing:1px}
#ov p{margin:0;color:var(--muted);line-height:1.65;font-size:15px}
#ov button{margin-top:12px;font:inherit;font-weight:800;font-size:18px;padding:13px 38px;border:0;border-radius:16px;background:var(--accent);color:#1a1a2e;box-shadow:0 6px 24px rgba(255,211,77,.35)}
#ov button:active{transform:scale(.96)}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <div id="ov">
    <h1 id="t">Tumble Block</h1>
    <p id="m">Tap left or right to leap.<br>Thread gates, dodge spinners, orbs and lasers.<br>Pass through the middle for PERFECT combos.<br>◎ shield &nbsp; ❄ slow time &nbsp; ◆ gems (centre gems = 3)</p>
    <button id="b">Play</button>
  </div>
</div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),W=360,H=640,$=id=>document.getElementById(id);
const dpr=Math.min(window.devicePixelRatio||1,2);
function resize(){const r=cv.getBoundingClientRect();cv.width=Math.round(r.width*dpr);cv.height=Math.round(r.height*dpr)}
addEventListener('resize',resize);resize();
let best=0;try{best=+localStorage.getItem('tb3_best')||0}catch(e){}
let AC=null;
function beep(f,d,type,v){try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.value=f;g.gain.value=v||.05;g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}
const SC=[0,2,4,7,9],ZONES=[['NEON DUSK',250],['AURORA',165],['EMBER',18],['ORCHID',305],['DEEP SEA',200]];
const stars=Array.from({length:60},()=>({x:Math.random()*W,y:Math.random()*H,z:.04+Math.random()*.3,r:Math.random()*1.5+.4}));
const lerp=(a,b,t)=>a+(b-a)*t;
let s,hue=250;
function init(){
  s={x:W/2-13,y:-150,px:W/2-13,py:-150,vx:0,tvx:0,vy:0,rot:0,pr:0,sx:1,sy:1,started:false,dead:false,camY:-H,pcam:-H,t:0,time:0,score:0,gems:0,combo:0,shield:false,inv:0,slow:0,
    gates:[],next:0,lastY:-300,parts:[],trail:[],texts:[],shake:0,zone:0,banner:{txt:'',l:0}};
  fill();
}
const diff=i=>{const t=Math.min(1,i/70);return t*t*(3-2*t)};
function fill(){
  while(s.lastY>s.camY-900){
    const i=s.next++,d=diff(i),pool=['gate','gate','gate'];
    if(i>=5)pool.push('spin');if(i>=10)pool.push('orb','spin');if(i>=16)pool.push('laser');if(i>=26)pool.push('spin','orb','laser');
    let kind=pool[Math.floor(Math.random()*pool.length)];if(kind===s.prev&&kind!=='gate')kind='gate';s.prev=kind;
    const y=s.lastY-({gate:230,spin:300,orb:300,laser:230})[kind];s.lastY=y;
    const g={y,i,kind,passed:false,phase:Math.random()*6.28,dir:Math.random()<.5?-1:1,sp:lerp(.011,.044,d)};
    if(kind==='gate'){g.gw=lerp(195,98,d);g.gem={x:40+Math.random()*(W-80),y:y-115,on:true,v:1}}
    if(kind==='spin'){g.R=lerp(82,112,d);g.cross=d>.5;g.gem={x:W/2,y,on:true,v:3}}
    if(kind==='orb'){g.cx=W/2+(Math.random()-.5)*80;g.R=lerp(70,86,d);g.n=d<.3?2:d<.7?3:4;g.gem={x:g.cx,y,on:true,v:3}}
    if(kind==='laser'){g.gem={x:40+Math.random()*(W-80),y:y-115,on:true,v:1}}
    if(i>=2&&Math.random()<lerp(.34,.14,d)){g.item={x:50+Math.random()*(W-100),y:y-(kind==='spin'||kind==='orb'?150:62),t:Math.random()<.55?'s':'t',on:true}}
    s.gates.push(g);
  }
}
const gapX=g=>W/2+Math.sin(s.t*g.sp+g.phase)*(W/2-g.gw/2-8);
const laserOn=g=>((s.t+g.phase*30)%190)>=140;
function segDist(px,py,ax,ay,bx,by){const dx=bx-ax,dy=by-ay;let t=((px-ax)*dx+(py-ay)*dy)/(dx*dx+dy*dy);t=Math.max(0,Math.min(1,t));return Math.hypot(px-(ax+t*dx),py-(ay+t*dy))}
function burst(x,y,n,col,sp){for(let i=0;i<n;i++){const a=Math.random()*6.28,v=Math.random()*(sp||3);s.parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:30+Math.random()*20,m:50,c:col})}}
function pop(txt,x,y,c){s.texts.push({txt,x,y,l:50,c})}
function jump(dir){
  if(s.dead)return;
  s.started=true;s.vy=-9.3;s.tvx=dir*3.6;s.sx=.68;s.sy=1.4;
  burst(s.x+13,s.y+26,6,'255,255,255',2);beep(380+Math.random()*50,.08,'triangle',.035);
}
function die(){
  s.dead=true;s.shake=16;
  burst(s.x+13,s.y+13,34,'77,214,255',7);beep(110,.45,'sawtooth',.07);
  if(s.score>best){best=s.score;try{localStorage.setItem('tb3_best',best)}catch(e){}}
  setTimeout(()=>{$('t').textContent='Game Over';
    $('m').innerHTML='Score <b>'+s.score+'</b> &nbsp;·&nbsp; Gems <b>'+s.gems+'</b><br>Best <b>'+best+'</b>';
    $('b').textContent='Play again';$('ov').style.display='flex'},900);
}
function hurt(){
  if(s.inv>0)return;
  if(s.shield){s.shield=false;s.inv=100;s.shake=10;burst(s.x+13,s.y+13,22,'120,230,255',6);beep(200,.25,'square',.06);s.combo=0}
  else die();
}
function passed(g,perfect){
  g.passed=true;
  if(perfect){s.combo++;const b=1+Math.min(s.combo,4);s.score+=b;pop('PERFECT +'+b,s.x+13,g.y-30,'255,211,77');burst(s.x+13,g.y,14,'255,211,77',4)}
  else{s.combo=0;s.score++}
  const f=261.6*Math.pow(2,SC[g.i%5]/12)*(1+(Math.floor(g.i/5)%2));beep(f,.2,'sine',.05);
  const z=Math.floor(s.score/12)%ZONES.length;
  if(z!==s.zone){s.zone=z;s.banner={txt:'ZONE · '+ZONES[z][0],l:120}}
}
function step(){
  s.px=s.x;s.py=s.y;s.pr=s.rot;s.pcam=s.camY;s.time++;
  s.parts.forEach(p=>{const k=s.dead?.35:1;p.x+=p.vx*k;p.y+=p.vy*k;p.vy+=.08*k;p.l-=k});
  s.parts=s.parts.filter(p=>p.l>0);
  s.texts.forEach(t=>t.l--);s.texts=s.texts.filter(t=>t.l>0);
  if(s.banner.l>0)s.banner.l--;
  s.shake*=.9;s.sx+=(1-s.sx)*.16;s.sy+=(1-s.sy)*.16;
  if(s.dead)return;
  if(!s.started){s.y=-150+Math.sin(s.time*.07)*5;s.rot=Math.sin(s.time*.04)*.15;s.py=s.y;s.pr=s.rot;return}
  s.t+=s.slow>0?.4:1;if(s.slow>0)s.slow--;if(s.inv>0)s.inv--;
  s.vy+=.42;s.y+=s.vy;s.vx+=(s.tvx-s.vx)*.22;s.x+=s.vx;
  if(s.x<0){s.x=0;s.vx=Math.abs(s.vx);s.tvx=Math.abs(s.tvx);s.sx=.8;burst(0,s.y+13,4,'255,255,255',2)}
  if(s.x>W-26){s.x=W-26;s.vx=-Math.abs(s.vx);s.tvx=-Math.abs(s.tvx);s.sx=.8;burst(W,s.y+13,4,'255,255,255',2)}
  s.rot+=s.vx*.04;
  const st=Math.min(.25,Math.abs(s.vy)*.016);if(Math.abs(s.sx-1)<.06)s.sy=1+st,s.sx=1-st*.5;
  s.trail.push({x:s.x,y:s.y,r:s.rot});if(s.trail.length>10)s.trail.shift();
  const tgt=s.y-400;if(tgt<s.camY)s.camY+=(tgt-s.camY)*.14;
  if(s.y>s.camY+H+10){s.shield=false;return die()}
  const cx=s.x+13,cy=s.y+13;
  for(const g of s.gates){
    if(g.kind==='spin'){
      const a=s.t*g.sp*g.dir*1.2;
      for(let k=0;k<(g.cross?2:1);k++){const an=a+k*Math.PI/2,dx=Math.cos(an)*g.R,dy=Math.sin(an)*g.R;
        if(segDist(cx,cy,W/2-dx,g.y-dy,W/2+dx,g.y+dy)<17)hurt()}
      if(!g.passed&&s.y<g.y-g.R-25)passed(g,false);
    }else if(g.kind==='orb'){
      const a=s.t*g.sp*g.dir*1.6;
      for(let k=0;k<g.n;k++){const an=a+k*6.283/g.n;if(Math.hypot(cx-(g.cx+Math.cos(an)*g.R),cy-(g.y+Math.sin(an)*g.R))<24)hurt()}
      if(!g.passed&&s.y<g.y-g.R-30)passed(g,false);
    }else if(g.kind==='laser'){
      if(laserOn(g)&&Math.abs(cy-g.y)<15)hurt();
      if(!g.passed&&s.y<g.y-24)passed(g,false);
    }else{
      const gx=gapX(g),L=gx-g.gw/2,R=gx+g.gw/2,px=s.x+2,py=s.y+2;
      if(py<g.y+18&&py+22>g.y&&(px<L||px+22>R))hurt();
      if(!g.passed&&s.y<g.y-20)passed(g,Math.abs(cx-gx)<g.gw*.16);
    }
    if(s.dead)return;
    const m=g.gem;
    if(m.on&&Math.hypot(cx-m.x,cy-m.y)<28){m.on=false;s.gems+=m.v;burst(m.x,m.y,12,'255,211,77',4);pop('+'+m.v,m.x,m.y-10,'255,211,77');beep(1100,.12,'square',.03)}
    const it=g.item;
    if(it&&it.on&&Math.hypot(cx-it.x,cy-it.y)<30){it.on=false;
      if(it.t==='s'){s.shield=true;pop('SHIELD',it.x,it.y-12,'120,230,255')}else{s.slow=300;pop('SLOW TIME',it.x,it.y-12,'190,160,255')}
      burst(it.x,it.y,16,'255,255,255',4);beep(700,.25,'triangle',.05)}
  }
  s.gates=s.gates.filter(g=>g.y<s.camY+H+200);fill();
  const th=ZONES[s.zone][1];hue+=((th-hue+540)%360-180)*.012;
}
function draw(a){
  const k=cv.width/W,cam=lerp(s.pcam,s.camY,a);
  ctx.setTransform(k,0,0,k,0,0);
  const gr=ctx.createLinearGradient(0,0,0,H);
  gr.addColorStop(0,`hsl(${hue},55%,9%)`);gr.addColorStop(1,`hsl(${hue+35},55%,23%)`);
  ctx.fillStyle=gr;ctx.fillRect(0,0,W,H);
  for(const t of stars){const y=(((t.y-cam*t.z)%H)+H)%H;ctx.fillStyle=`rgba(255,255,255,${.2+t.z})`;ctx.beginPath();ctx.arc(t.x,y,t.r,0,6.28);ctx.fill()}
  if(s.shake>.3)ctx.translate((Math.random()-.5)*s.shake,(Math.random()-.5)*s.shake);
  const oc=`hsl(${hue+170},85%,62%)`,oc2=`hsl(${hue+170},90%,82%)`;
  ctx.lineCap='round';
  for(const g of s.gates){
    const sy=g.y-cam,t=s.t+a*(s.slow>0?.4:1)*(s.started&&!s.dead?1:0);
    if(g.kind==='spin'){
      const an0=t*g.sp*g.dir*1.2;ctx.lineWidth=14;ctx.strokeStyle=oc;
      for(let q=0;q<(g.cross?2:1);q++){const an=an0+q*Math.PI/2,dx=Math.cos(an)*g.R,dy=Math.sin(an)*g.R;ctx.beginPath();ctx.moveTo(W/2-dx,sy-dy);ctx.lineTo(W/2+dx,sy+dy);ctx.stroke()}
      ctx.fillStyle=oc2;ctx.beginPath();ctx.arc(W/2,sy,9,0,6.28);ctx.fill();
    }else if(g.kind==='orb'){
      const an0=t*g.sp*g.dir*1.6;ctx.strokeStyle='rgba(255,255,255,.12)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(g.cx,sy,g.R,0,6.28);ctx.stroke();
      ctx.shadowColor=oc;ctx.shadowBlur=14;ctx.fillStyle=oc;
      for(let q=0;q<g.n;q++){const an=an0+q*6.283/g.n;ctx.beginPath();ctx.arc(g.cx+Math.cos(an)*g.R,sy+Math.sin(an)*g.R,13,0,6.28);ctx.fill()}
      ctx.shadowBlur=0;ctx.fillStyle=oc2;ctx.beginPath();ctx.arc(g.cx,sy,6,0,6.28);ctx.fill();
    }else if(g.kind==='laser'){
      const p=(t+g.phase*30)%190;ctx.fillStyle=oc2;ctx.fillRect(0,sy-8,10,16);ctx.fillRect(W-10,sy-8,10,16);
      if(p>=140){ctx.shadowColor='#ff4d6d';ctx.shadowBlur=16;ctx.strokeStyle='#ff4d6d';ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(10,sy);ctx.lineTo(W-10,sy);ctx.stroke();ctx.shadowBlur=0}
      else if(p>=100){ctx.strokeStyle=`rgba(255,77,109,${(p-100)/60})`;ctx.lineWidth=2;ctx.setLineDash([6,8]);ctx.beginPath();ctx.moveTo(10,sy);ctx.lineTo(W-10,sy);ctx.stroke();ctx.setLineDash([])}
    }else{
      const gx=W/2+Math.sin(t*g.sp+g.phase)*(W/2-g.gw/2-8);ctx.fillStyle=oc;
      ctx.beginPath();ctx.roundRect(-10,sy,gx-g.gw/2+10,18,6);ctx.fill();
      ctx.beginPath();ctx.roundRect(gx+g.gw/2,sy,W-gx-g.gw/2+10,18,6);ctx.fill();
      ctx.fillStyle=oc2;ctx.fillRect(gx-g.gw/2-4,sy,4,18);ctx.fillRect(gx+g.gw/2,sy,4,18);
    }
    const m=g.gem;
    if(m.on){const my=m.y-cam+Math.sin(s.time*.08+g.i)*3,sc=Math.abs(Math.cos(s.time*.05+g.i))*.6+.4,z=m.v>1?15:11;
      ctx.shadowColor='#ffd34d';ctx.shadowBlur=m.v>1?18:8;ctx.fillStyle='#ffd34d';
      ctx.beginPath();ctx.moveTo(m.x,my-z);ctx.lineTo(m.x+z*sc,my);ctx.lineTo(m.x,my+z);ctx.lineTo(m.x-z*sc,my);ctx.fill();ctx.shadowBlur=0}
    const it=g.item;
    if(it&&it.on){const iy=it.y-cam+Math.sin(s.time*.07+g.i)*4,c=it.t==='s'?'120,230,255':'190,160,255';
      ctx.shadowColor=`rgb(${c})`;ctx.shadowBlur=16;ctx.fillStyle=`rgba(${c},.25)`;ctx.strokeStyle=`rgb(${c})`;ctx.lineWidth=3;
      ctx.beginPath();ctx.arc(it.x,iy,15,0,6.28);ctx.fill();ctx.stroke();ctx.shadowBlur=0;
      ctx.fillStyle=`rgb(${c})`;ctx.font='700 16px system-ui';ctx.textAlign='center';ctx.fillText(it.t==='s'?'◎':'❄',it.x,iy+6)}
  }
  s.trail.forEach((p,i)=>{ctx.save();ctx.globalAlpha=(i+1)/s.trail.length*(.18+Math.min(s.combo,4)*.05);ctx.translate(p.x+13,p.y+13-cam);ctx.rotate(p.r);
    ctx.fillStyle=s.combo>1?'#ffd34d':'#4dd6ff';ctx.fillRect(-13,-13,26,26);ctx.restore()});
  for(const p of s.parts){ctx.fillStyle=`rgba(${p.c||'255,255,255'},${Math.max(0,p.l/p.m)})`;ctx.fillRect(p.x-2,p.y-cam-2,4,4)}
  if(!s.dead){
    const ix=lerp(s.px,s.x,a)+13,iy=lerp(s.py,s.y,a)+13-cam,blink=s.inv>0&&Math.floor(s.inv/5)%2;
    if(!blink){ctx.save();ctx.translate(ix,iy);ctx.rotate(lerp(s.pr,s.rot,a));ctx.scale(s.sx,s.sy);
      ctx.shadowColor='#4dd6ff';ctx.shadowBlur=14;ctx.fillStyle='#4dd6ff';ctx.beginPath();ctx.roundRect(-13,-13,26,26,6);ctx.fill();
      ctx.shadowBlur=0;ctx.fillStyle='#d4f6ff';ctx.beginPath();ctx.roundRect(-13,-13,26,8,4);ctx.fill();ctx.restore()}
    if(s.shield){ctx.strokeStyle=`rgba(120,230,255,${.6+Math.sin(s.time*.15)*.3})`;ctx.lineWidth=3;ctx.beginPath();ctx.arc(ix,iy,24,0,6.28);ctx.stroke()}
  }
  ctx.textAlign='center';ctx.font='800 16px system-ui';
  for(const t of s.texts){ctx.fillStyle=`rgba(${t.c},${Math.min(1,t.l/25)})`;ctx.fillText(t.txt,t.x,t.y-cam-(50-t.l)*.8)}
  ctx.setTransform(k,0,0,k,0,0);
  if(s.slow>0){ctx.fillStyle='rgba(120,90,255,.10)';ctx.fillRect(0,0,W,H);ctx.fillStyle='rgba(190,160,255,.9)';ctx.fillRect(W/2-40,76,80*s.slow/300,4)}
  ctx.fillStyle='#fff';ctx.font='800 48px system-ui';ctx.textAlign='center';ctx.fillText(s.score,W/2,58);
  ctx.fillStyle='#ffd34d';ctx.font='800 18px system-ui';ctx.textAlign='right';ctx.fillText('◆ '+s.gems,W-16,32);
  ctx.textAlign='left';ctx.fillStyle='rgba(255,255,255,.55)';ctx.font='700 13px system-ui';ctx.fillText('BEST '+best,16,32);ctx.fillText('LEVEL '+(1+Math.floor(s.score/10)),16,50);
  if(s.combo>1){ctx.textAlign='center';ctx.fillStyle='#ffd34d';ctx.font='800 15px system-ui';ctx.fillText('COMBO ×'+s.combo,W/2,96)}
  if(s.banner.l>0){const al=Math.min(1,s.banner.l/30,(120-s.banner.l)/20);ctx.textAlign='center';ctx.fillStyle=`rgba(255,255,255,${al})`;ctx.font='800 22px system-ui';ctx.fillText(s.banner.txt,W/2,H/2-60)}
  if(!s.started&&!s.dead){ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,.55)';ctx.font='15px system-ui';ctx.fillText('◀ tap left        tap right ▶',W/2,H-34)}
}
let last=0,acc=0;const STEP=1000/60;
function loop(ts){
  const d=Math.min(ts-(last||ts),100);last=ts;acc+=d;
  while(acc>=STEP){step();acc-=STEP}
  draw(acc/STEP);requestAnimationFrame(loop);
}
$('b').addEventListener('click',()=>{init();$('ov').style.display='none'});
cv.addEventListener('pointerdown',e=>{e.preventDefault();const r=cv.getBoundingClientRect();jump(e.clientX<r.left+r.width/2?-1:1)});
addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='a')jump(-1);if(e.key==='ArrowRight'||e.key==='d')jump(1)});
init();requestAnimationFrame(loop);
</script>
</body>
</html>
